<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quantumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#quantumGrad)"/>
  
  <!-- Quantum particles -->
  <circle cx="150" cy="100" r="8" fill="#fff" opacity="0.6">
    <animate attributeName="cy" values="100;120;100" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="650" cy="150" r="6" fill="#fff" opacity="0.5">
    <animate attributeName="cy" values="150;130;150" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="80" r="5" fill="#fff" opacity="0.7">
    <animate attributeName="cy" values="80;100;80" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Lock icon -->
  <g transform="translate(300, 150)">
    <rect x="40" y="80" width="120" height="140" rx="10" fill="#fff" opacity="0.9"/>
    <path d="M 60 80 L 60 40 Q 60 0 100 0 Q 140 0 140 40 L 140 80" 
          fill="none" stroke="#fff" stroke-width="20" opacity="0.9"/>
    <circle cx="100" cy="140" r="15" fill="#667eea"/>
    <rect x="95" y="140" width="10" height="30" fill="#667eea"/>
  </g>
  
  <!-- Message bubbles -->
  <rect x="50" y="350" width="300" height="80" rx="15" fill="#fff" opacity="0.8"/>
  <rect x="450" y="420" width="300" height="80" rx="15" fill="#4fd1c5" opacity="0.8"/>
  
  <!-- Encryption symbols -->
  <text x="400" y="320" font-family="monospace" font-size="24" fill="#fff" opacity="0.6">
    🔐 Kyber-1024
  </text>
  
  <!-- Title -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="32" font-weight="bold" 
        fill="#fff" text-anchor="middle">QuantumChat</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="16" 
        fill="#fff" text-anchor="middle" opacity="0.9">Post-Quantum Secure Messaging</text>
</svg>