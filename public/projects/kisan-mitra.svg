<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="kisanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#56ab2f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8e063;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#87ceeb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8e063;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="800" height="400" fill="url(#skyGrad)"/>
  
  <!-- Ground -->
  <rect y="400" width="800" height="200" fill="url(#kisanGrad)"/>
  
  <!-- Sun -->
  <circle cx="700" cy="100" r="50" fill="#ffd700" opacity="0.8"/>
  
  <!-- Crop field rows -->
  <g opacity="0.6">
    <rect x="50" y="420" width="700" height="15" fill="#2d5016"/>
    <rect x="50" y="450" width="700" height="15" fill="#2d5016"/>
    <rect x="50" y="480" width="700" height="15" fill="#2d5016"/>
    <rect x="50" y="510" width="700" height="15" fill="#2d5016"/>
  </g>
  
  <!-- Plant leaves (stylized) -->
  <g transform="translate(150, 380)">
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(30)"/>
    <rect x="-3" y="0" width="6" height="50" fill="#2e7d32"/>
  </g>
  <g transform="translate(300, 400)">
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(30)"/>
    <rect x="-3" y="0" width="6" height="50" fill="#2e7d32"/>
  </g>
  <g transform="translate(450, 390)">
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(30)"/>
    <rect x="-3" y="0" width="6" height="50" fill="#2e7d32"/>
  </g>
  <g transform="translate(600, 395)">
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="20" ry="40" fill="#4caf50" transform="rotate(30)"/>
    <rect x="-3" y="0" width="6" height="50" fill="#2e7d32"/>
  </g>
  
  <!-- AI Brain icon -->
  <g transform="translate(80, 80)">
    <circle cx="0" cy="0" r="60" fill="#fff" opacity="0.9"/>
    <!-- Neural network nodes -->
    <circle cx="-20" cy="-20" r="8" fill="#4caf50"/>
    <circle cx="20" cy="-20" r="8" fill="#4caf50"/>
    <circle cx="-20" cy="20" r="8" fill="#4caf50"/>
    <circle cx="20" cy="20" r="8" fill="#4caf50"/>
    <circle cx="0" cy="0" r="8" fill="#4caf50"/>
    <!-- Connections -->
    <line x1="-20" y1="-20" x2="0" y2="0" stroke="#4caf50" stroke-width="2"/>
    <line x1="20" y1="-20" x2="0" y2="0" stroke="#4caf50" stroke-width="2"/>
    <line x1="-20" y1="20" x2="0" y2="0" stroke="#4caf50" stroke-width="2"/>
    <line x1="20" y1="20" x2="0" y2="0" stroke="#4caf50" stroke-width="2"/>
  </g>
  
  <!-- Mobile phone mockup -->
  <g transform="translate(550, 180)">
    <rect x="0" y="0" width="180" height="320" rx="20" fill="#333" opacity="0.9"/>
    <rect x="10" y="10" width="160" height="300" rx="10" fill="#fff"/>
    
    <!-- App UI elements -->
    <rect x="20" y="30" width="140" height="60" rx="8" fill="#4caf50" opacity="0.3"/>
    <rect x="20" y="100" width="140" height="60" rx="8" fill="#ff9800" opacity="0.3"/>
    <rect x="20" y="170" width="140" height="60" rx="8" fill="#2196f3" opacity="0.3"/>
    
    <text x="90" y="65" font-family="Arial, sans-serif" font-size="12" 
          fill="#2e7d32" text-anchor="middle" font-weight="bold">Crop Suggest</text>
    <text x="90" y="135" font-family="Arial, sans-serif" font-size="12" 
          fill="#e65100" text-anchor="middle" font-weight="bold">Disease Scan</text>
    <text x="90" y="205" font-family="Arial, sans-serif" font-size="12" 
          fill="#1565c0" text-anchor="middle" font-weight="bold">Market Price</text>
  </g>
  
  <!-- Title -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#fff" text-anchor="middle">Kisan Mitra</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="16" 
        fill="#fff" text-anchor="middle" opacity="0.9">AI-Powered Farming Assistant</text>
</svg>