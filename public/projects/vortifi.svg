<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vortifiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#vortifiGrad)"/>
  
  <!-- Blockchain blocks -->
  <g opacity="0.9">
    <rect x="100" y="150" width="120" height="100" rx="8" fill="url(#blockGrad)"/>
    <rect x="260" y="150" width="120" height="100" rx="8" fill="url(#blockGrad)"/>
    <rect x="420" y="150" width="120" height="100" rx="8" fill="url(#blockGrad)"/>
    <rect x="580" y="150" width="120" height="100" rx="8" fill="url(#blockGrad)"/>
    
    <!-- Chain connections -->
    <line x1="220" y1="200" x2="260" y2="200" stroke="#fff" stroke-width="4"/>
    <line x1="380" y1="200" x2="420" y2="200" stroke="#fff" stroke-width="4"/>
    <line x1="540" y1="200" x2="580" y2="200" stroke="#fff" stroke-width="4"/>
  </g>
  
  <!-- Voting ballot -->
  <g transform="translate(250, 320)">
    <rect width="300" height="200" rx="12" fill="#fff" opacity="0.95"/>
    <text x="150" y="40" font-family="Arial, sans-serif" font-size="24" font-weight="bold" 
          fill="#333" text-anchor="middle">Ballot</text>
    
    <!-- Checkboxes -->
    <rect x="30" y="70" width="25" height="25" rx="4" fill="none" stroke="#4facfe" stroke-width="2"/>
    <polyline points="35,82 40,87 50,77" fill="none" stroke="#4facfe" stroke-width="3"/>
    <text x="65" y="88" font-family="Arial, sans-serif" font-size="16" fill="#333">Candidate A</text>
    
    <rect x="30" y="110" width="25" height="25" rx="4" fill="none" stroke="#666" stroke-width="2"/>
    <text x="65" y="128" font-family="Arial, sans-serif" font-size="16" fill="#666">Candidate B</text>
    
    <rect x="30" y="150" width="25" height="25" rx="4" fill="none" stroke="#666" stroke-width="2"/>
    <text x="65" y="168" font-family="Arial, sans-serif" font-size="16" fill="#666">Candidate C</text>
  </g>
  
  <!-- Ethereum logo simplified -->
  <g transform="translate(50, 400)">
    <polygon points="30,0 60,50 30,35 0,50" fill="#fff" opacity="0.8"/>
    <polygon points="30,35 60,50 30,70 0,50" fill="#fff" opacity="0.5"/>
  </g>
  
  <!-- Title -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#fff" text-anchor="middle">VortiFi</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="16" 
        fill="#fff" text-anchor="middle" opacity="0.9">Blockchain Voting DApp</text>
</svg>