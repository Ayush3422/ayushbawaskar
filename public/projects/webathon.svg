<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="webathonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fa709a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fee140;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#webathonGrad)"/>
  
  <!-- Code brackets -->
  <text x="50" y="100" font-family="monospace" font-size="120" font-weight="bold" 
        fill="#fff" opacity="0.3">&lt;/&gt;</text>
  <text x="600" y="500" font-family="monospace" font-size="120" font-weight="bold" 
        fill="#fff" opacity="0.3">&lt;/&gt;</text>
  
  <!-- Design thumbnails grid -->
  <g opacity="0.9">
    <!-- Row 1 -->
    <rect x="150" y="150" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="330" y="150" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="510" y="150" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- Row 2 -->
    <rect x="150" y="280" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="330" y="280" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="510" y="280" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- Row 3 (2 designs) -->
    <rect x="240" y="410" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="420" y="410" width="140" height="100" rx="8" fill="#fff" stroke="#333" stroke-width="2"/>
    
    <!-- Design numbers -->
    <text x="220" y="210" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">1</text>
    <text x="400" y="210" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">2</text>
    <text x="580" y="210" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">3</text>
    <text x="220" y="340" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">4</text>
    <text x="400" y="340" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">5</text>
    <text x="580" y="340" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">6</text>
    <text x="310" y="470" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">7</text>
    <text x="490" y="470" font-family="Arial, sans-serif" font-size="48" font-weight="bold" 
          fill="#fa709a" text-anchor="middle">8</text>
  </g>
  
  <!-- TypeScript badge -->
  <rect x="650" y="50" width="120" height="40" rx="20" fill="#3178c6"/>
  <text x="710" y="77" font-family="Arial, sans-serif" font-size="16" font-weight="bold" 
        fill="#fff" text-anchor="middle">TypeScript</text>
  
  <!-- Title -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-size="36" font-weight="bold" 
        fill="#fff" text-anchor="middle">WEBATHON</text>
  <text x="400" y="585" font-family="Arial, sans-serif" font-size="16" 
        fill="#fff" text-anchor="middle" opacity="0.9">8 Unique Design Implementations</text>
</svg>